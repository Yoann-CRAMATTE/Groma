<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Relevé GPS d'ouvrages Eau, Assainissement et SPANC vers un fichier CSV unique.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f14">
  <title>GéoLoc</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- En-tête et onglets collent ensemble : évite d'aligner la nav sur une hauteur codée en dur. -->
  <div class="barre-haute">
    <header class="entete">
      <h1>GÉO<span>LOC</span></h1>
      <span class="badge-fichier" id="badge-fichier" data-etat="neutre">…</span>
    </header>

    <nav class="onglets" id="onglets" role="tablist" aria-label="Filières"></nav>
  </div>

  <main id="vues"></main>

  <!-- Communes saisies dans Configuration : évite de les retaper sur le terrain. -->
  <datalist id="liste-communes"></datalist>

  <!-- Ajustement cartographique : la croix est fixe, c'est la carte qui se déplace dessous. -->
  <div class="modale" id="modale-carte" hidden>
    <div class="modale-fond" id="modale-fond"></div>

    <div class="modale-fenetre" role="dialog" aria-modal="true" aria-labelledby="modale-titre">
      <header class="modale-entete">
        <h2 id="modale-titre">Ajuster la position</h2>
        <button type="button" class="modale-fermer" id="modale-fermer" aria-label="Fermer">✕</button>
      </header>

      <div class="carte" id="carte-hote">
        <div class="carte-croix" aria-hidden="true"></div>
        <p class="carte-message" id="carte-message"></p>
      </div>

      <div class="carte-barre">
        <div class="carte-fonds" id="carte-fonds" role="group" aria-label="Fond de carte"></div>
        <div class="carte-zoom">
          <button type="button" id="carte-moins" aria-label="Dézoomer">−</button>
          <span id="carte-echelle" class="carte-echelle">—</span>
          <button type="button" id="carte-plus" aria-label="Zoomer">+</button>
        </div>
      </div>

      <dl class="carte-infos">
        <div><dt>Latitude</dt><dd id="carte-lat">—</dd></div>
        <div><dt>Longitude</dt><dd id="carte-lon">—</dd></div>
        <div><dt>Écart au GPS</dt><dd id="carte-ecart">—</dd></div>
      </dl>

      <div class="actions">
        <button type="button" id="carte-recentrer">Revenir au GPS</button>
        <button type="button" class="btn-primaire" id="carte-valider">Valider cette position</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/lambert93.js"></script>
  <script src="js/carte.js"></script>
  <script src="js/config.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/store.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
