name: Déploiement GitHub Pages

# L'application est faite de fichiers statiques : rien à construire, on publie
# le dépôt tel quel. Le GPS exige un contexte sécurisé, et Pages sert en HTTPS —
# c'est ce qui rend GéoLoc utilisable sur un téléphone de terrain.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans annuler celle en cours : interrompre un
# déploiement à mi-chemin laisserait le site dans un état indéterminé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement` active Pages au premier passage si ce n'est pas déjà fait,
      # ce qui évite un aller-retour dans les réglages du dépôt.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploiement
        uses: actions/deploy-pages@v4
