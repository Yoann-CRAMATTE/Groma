<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Synapse OS — Desktop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400&family=DM+Mono:wght@300;400&display=swap');

  :root {
    --bg: #0a0a0c;
    --surface: #111114;
    --ring: #1e1e24;
    --accent: #5b8fff;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --muted: #555566;
    --glow: rgba(91, 143, 255, 0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.08) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.05) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 70%, rgba(255,255,255,0.06) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.04) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.07) 0%, transparent 100%);
    pointer-events: none;
  }

  .cursor {
    position: fixed;
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease;
    z-index: 9999;
    box-shadow: 0 0 12px var(--accent);
  }
  .cursor-ring {
    position: fixed;
    width: 28px;
    height: 28px;
    border: 1px solid rgba(91,143,255,0.4);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease, width 0.2s ease, height 0.2s ease;
    z-index: 9998;
  }

  .desktop {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .orb {
    position: fixed;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--surface);
    border: 1.5px solid var(--ring);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: none;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    box-shadow:
      0 0 0 1px rgba(91,143,255,0.08),
      0 0 40px rgba(91,143,255,0.08),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .orb:hover {
    transform: translateX(-50%) scale(1.08);
    border-color: rgba(91,143,255,0.4);
    box-shadow:
      0 0 0 1px rgba(91,143,255,0.2),
      0 0 60px rgba(91,143,255,0.2),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .orb:hover .orb-pulse {
    opacity: 1;
    animation: pulse 2s infinite;
  }
  .orb-pulse {
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    border: 1px solid rgba(91,143,255,0.15);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .orb-pulse::after {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(91,143,255,0.07);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.06); opacity: 0.3; }
  }

  .orb-time {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.5px;
    color: var(--text);
    line-height: 1;
  }
  .orb-date {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .orb-status {
    position: absolute;
    bottom: -28px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .status-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
    transition: all 0.2s;
    border-radius: 50%;
    padding: 2px;
  }
  .status-icon svg {
    width: 12px;
    height: 12px;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.2s;
  }
  .status-icon.on svg { stroke: #4ade80; filter: drop-shadow(0 0 4px #4ade80); }
  .status-icon.off svg { stroke: var(--muted); opacity: 0.5; }
  .status-icon.toggle svg { stroke: var(--accent); filter: drop-shadow(0 0 4px rgba(91,143,255,0.5)); }
  .status-icon:hover { background: rgba(255,255,255,0.05); }

  .menu {
    position: fixed;
    bottom: 160px;
    left: 50%;
    z-index: 500;
    transform: translateX(-50%) translateY(20px);
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .menu.open {
    opacity: 1;
    pointer-events: all;
    transform: translateX(-50%) translateY(0);
  }

  .ai-bar {
    background: var(--surface);
    border: 1px solid var(--ring);
    border-radius: 40px;
    padding: 10px 20px 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    width: 320px;
    box-shadow: 0 0 30px rgba(91,143,255,0.1);
  }
  .ai-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    flex-shrink: 0;
    box-shadow: 0 0 12px rgba(91,143,255,0.4);
    animation: aiBreath 3s ease infinite;
  }
  @keyframes aiBreath {
    0%, 100% { opacity: 1; box-shadow: 0 0 12px rgba(91,143,255,0.4); }
    50% { opacity: 0.8; box-shadow: 0 0 20px rgba(167,139,250,0.5); }
  }
  .ai-text {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .ai-text span {
    color: rgba(91,143,255,0.7);
    font-size: 10px;
    font-family: 'DM Mono', monospace;
  }

  .menu-row {
    display: flex;
    gap: 20px;
    align-items: center;
    justify-content: center;
  }

  .menu-cat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .cat-orb {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--ring);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .cat-orb:hover, .cat-orb.active {
    transform: scale(1.12);
    border-color: var(--accent);
    box-shadow: 0 0 24px rgba(91,143,255,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .cat-orb.active svg { stroke: var(--accent); }
  .cat-orb svg {
    width: 22px;
    height: 22px;
    stroke: var(--muted);
    transition: stroke 0.2s;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .cat-orb:hover svg { stroke: var(--accent); }

  .cat-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-weight: 300;
  }

  .apps-row {
    display: flex;
    gap: 16px;
    align-items: center;
    min-height: 72px;
    transition: opacity 0.25s ease;
  }
  .apps-row.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .app-orb {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--ring);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: none;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex-direction: column;
    gap: 0;
    position: relative;
  }
  .app-orb:hover {
    transform: scale(1.15);
    border-color: rgba(91,143,255,0.5);
    box-shadow: 0 0 20px rgba(91,143,255,0.15);
  }
  .app-orb svg {
    width: 16px;
    height: 16px;
    stroke: var(--muted);
    transition: stroke 0.2s;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .app-orb:hover svg { stroke: var(--accent); }
  .app-name {
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .sep {
    width: 1px;
    height: 32px;
    background: var(--ring);
    opacity: 0.6;
  }

  .ai-notif {
    position: absolute;
    top: 32px;
    right: 40px;
    background: var(--surface);
    border: 1px solid var(--ring);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--muted);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    animation: slideIn 0.5s 0.3s both cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ai-notif-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 8px var(--accent);
    flex-shrink: 0;
  }

  .tooltip {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--ring);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.5px;
    z-index: 10;
  }
  .app-orb:hover .tooltip,
  .cat-orb:hover .tooltip { opacity: 1; }

  .hint {
    position: absolute;
    bottom: 152px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.5;
    transition: opacity 0.3s;
    pointer-events: none;
    font-family: 'DM Mono', monospace;
  }
  .hint.hidden { opacity: 0; }

  .app-window {
    position: fixed;
    inset: 0;
    background: #0d0d10;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  .app-window.visible {
    opacity: 1;
    pointer-events: all;
  }
  .app-window-title {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .app-window-canvas {
    width: 480px;
    height: 300px;
    background: var(--surface);
    border: 1px solid var(--ring);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
    font-family: 'DM Mono', monospace;
  }

  .bourrelet {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    z-index: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: none;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .bourrelet.visible {
    transform: translateX(-50%) translateY(0);
  }
  .bourrelet-shape {
    width: 100px;
    height: 32px;
    background: var(--surface);
    border: 1px solid var(--ring);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 6px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    transition:
      width 0.35s cubic-bezier(0.34,1.56,0.64,1),
      height 0.35s cubic-bezier(0.34,1.56,0.64,1),
      border-radius 0.35s cubic-bezier(0.34,1.56,0.64,1),
      border 0.35s ease,
      background 0.25s,
      box-shadow 0.3s;
  }
  .bourrelet:hover .bourrelet-shape {
    width: 120px;
    background: #161618;
    box-shadow: 0 -4px 28px rgba(91,143,255,0.15), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .bourrelet.morphed {
    bottom: 48px;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), bottom 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .bourrelet.morphed .bourrelet-shape {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 1.5px solid rgba(91,143,255,0.4);
    box-shadow: 0 0 40px rgba(91,143,255,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
    background: var(--surface);
  }
  .bourrelet.morphed .bourrelet-time,
  .bourrelet.morphed .bourrelet-date {
    font-size: 0;
    opacity: 0;
    transition: font-size 0.2s, opacity 0.2s;
  }
  .bourrelet-time {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 1px;
    line-height: 1;
    transition: font-size 0.2s, opacity 0.2s;
  }
  .bourrelet-date {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 0.5px;
    transition: font-size 0.2s, opacity 0.2s;
  }

  .demo-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--surface);
    border: 1px solid var(--ring);
    border-radius: 20px;
    padding: 8px 14px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    cursor: none;
    z-index: 400;
    letter-spacing: 0.5px;
    transition: border-color 0.2s, color 0.2s;
  }
  .demo-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="desktop">
  <div class="ai-notif">
    <div class="ai-notif-dot"></div>
    Synapse IA — connecté · Llama 3.2 local
  </div>
  <div class="hint" id="hint">Cliquer pour ouvrir</div>
</div>

<div class="menu" id="menu">
  <div class="ai-bar">
    <div class="ai-dot"></div>
    <div class="ai-text">
      Que voulez-vous faire ?<br>
      <span>synapse:// IA active · llama3.2:8b</span>
    </div>
  </div>

  <div class="apps-row hidden" id="apps-row"></div>

  <div class="menu-row">
    <div class="menu-cat">
      <div class="cat-orb" data-cat="bureau">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        <div class="tooltip">Bureautique</div>
      </div>
      <span class="cat-label">Bureau</span>
    </div>
    <div class="menu-cat">
      <div class="cat-orb" data-cat="jeux">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <div class="tooltip">Jeux</div>
      </div>
      <span class="cat-label">Jeux</span>
    </div>
    <div class="menu-cat">
      <div class="cat-orb" data-cat="ia">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <div class="tooltip">IA</div>
      </div>
      <span class="cat-label">IA</span>
    </div>
    <div class="menu-cat">
      <div class="cat-orb" data-cat="store">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <div class="tooltip">Store</div>
      </div>
      <span class="cat-label">Store</span>
    </div>
    <div class="menu-cat">
      <div class="cat-orb" data-cat="systeme">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        <div class="tooltip">Système</div>
      </div>
      <span class="cat-label">Système</span>
    </div>
  </div>
</div>

<div class="orb" id="orb">
  <div class="orb-pulse"></div>
  <div class="orb-time" id="time">--:--</div>
  <div class="orb-date" id="date">--- --</div>
  <div class="orb-status">
    <div class="status-icon on" id="btn-wifi">
      <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>
    </div>
    <div class="status-icon off" id="btn-bt">
      <svg viewBox="0 0 24 24"><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/></svg>
    </div>
    <div class="status-icon toggle" id="btn-theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </div>
  </div>
</div>

<div class="app-window" id="appWindow">
  <div class="app-window-title">Paint · synapse</div>
  <div class="app-window-canvas">Zone de dessin — Paint IA</div>
</div>

<div class="bourrelet" id="bourrelet">
  <div class="bourrelet-shape">
    <div class="bourrelet-time" id="bTime">--:--</div>
    <div class="bourrelet-date" id="bDate">---</div>
  </div>
</div>

<div class="demo-btn" id="demoBtn">[ simuler app ouverte ]</div>

<script>
  // Curseur custom
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    ring.style.left = e.clientX + 'px';
    ring.style.top = e.clientY + 'px';
  });

  // Horloge
  function updateTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const timeStr = h + ':' + m;
    const days = ['DIM','LUN','MAR','MER','JEU','VEN','SAM'];
    const months = ['JAN','FÉV','MAR','AVR','MAI','JUN','JUL','AOÛ','SEP','OCT','NOV','DÉC'];
    const dateStr = days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()];
    document.getElementById('time').textContent = timeStr;
    document.getElementById('date').textContent = dateStr;
    document.getElementById('bTime').textContent = timeStr;
    document.getElementById('bDate').textContent = days[now.getDay()];
  }
  updateTime();
  setInterval(updateTime, 1000);

  // Données des catégories
  const CATS = {
    bureau: [
      { name: 'Texte',    icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>' },
      { name: 'Paint',    icon: '<circle cx="12" cy="12" r="3"/><path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>' },
      { name: 'Notes',    icon: '<path d="M4 6h16M4 10h16M4 14h8"/>' },
      { name: 'Tableur',  icon: '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 8h18M8 3v18M13 3v18"/>' },
    ],
    jeux: [
      { name: 'Arcade',   icon: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 12h4M8 10v4M15 11h2M15 13h2"/>' },
      { name: 'Puzzle',   icon: '<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>' },
      { name: 'Carte',    icon: '<polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>' },
    ],
    ia: [
      { name: 'Chat',     icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' },
      { name: 'Image',    icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>' },
      { name: 'Code',     icon: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>' },
      { name: 'Voix',     icon: '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>' },
    ],
    store: [
      { name: 'Top',      icon: '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>' },
      { name: 'Nouveau',  icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>' },
      { name: 'Gratuit',  icon: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>' },
      { name: 'Outils',   icon: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>' },
    ],
    systeme: [
      { name: 'Config',   icon: '<circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/>' },
      { name: 'IA',       icon: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' },
      { name: 'Réseau',   icon: '<rect x="9" y="2" width="6" height="6"/><rect x="16" y="16" width="6" height="6"/><rect x="2" y="16" width="6" height="6"/><path d="M5 16V9h14v7M12 8v8"/>' },
      { name: 'Info',     icon: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12.01" y2="8"/><line x1="12" y1="12" x2="12" y2="16"/>' },
    ],
  };

  // État
  let menuOpen = false;
  let activeCat = null;
  let appMode = false;
  let bourrelетMorphed = false;

  const menuEl     = document.getElementById('menu');
  const orbEl      = document.getElementById('orb');
  const hintEl     = document.getElementById('hint');
  const appsRow    = document.getElementById('apps-row');
  const appWindow  = document.getElementById('appWindow');
  const bourrelet  = document.getElementById('bourrelet');
  const demoBtn    = document.getElementById('demoBtn');

  function openMenu() {
    menuOpen = true;
    menuEl.classList.add('open');
    hintEl.classList.add('hidden');
  }

  function closeMenu() {
    menuOpen = false;
    menuEl.classList.remove('open');
    hintEl.classList.remove('hidden');
    clearApps();
  }

  function clearApps() {
    activeCat = null;
    appsRow.innerHTML = '';
    appsRow.classList.add('hidden');
    document.querySelectorAll('.cat-orb').forEach(o => o.classList.remove('active'));
  }

  function showApps(cat) {
    const apps = CATS[cat];
    appsRow.innerHTML = '';
    apps.forEach(app => {
      const orb = document.createElement('div');
      orb.className = 'app-orb';
      orb.innerHTML = `<svg viewBox="0 0 24 24">${app.icon}</svg><div class="app-name">${app.name}</div><div class="tooltip">${app.name}</div>`;
      appsRow.appendChild(orb);
    });
    appsRow.classList.remove('hidden');
  }

  // Clic orbe principal
  orbEl.addEventListener('click', e => {
    e.stopPropagation();
    menuOpen ? closeMenu() : openMenu();
  });

  // Clic catégorie
  document.querySelectorAll('.cat-orb').forEach(catOrb => {
    catOrb.addEventListener('click', e => {
      e.stopPropagation();
      const cat = catOrb.dataset.cat;
      if (activeCat === cat) {
        clearApps();
      } else {
        document.querySelectorAll('.cat-orb').forEach(o => o.classList.remove('active'));
        catOrb.classList.add('active');
        activeCat = cat;
        showApps(cat);
      }
    });
  });

  // Clic ailleurs → ferme tout
  document.addEventListener('click', e => {
    if (menuOpen && !menuEl.contains(e.target) && e.target !== orbEl) {
      closeMenu();
    }
  });

  // Bouton démo : simule une app ouverte
  demoBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (!appMode) {
      appMode = true;
      appWindow.classList.add('visible');
      orbEl.style.opacity = '0';
      orbEl.style.pointerEvents = 'none';
      closeMenu();
      bourrelet.classList.add('visible');
      demoBtn.textContent = '[ fermer app ]';
    } else {
      appMode = false;
      appWindow.classList.remove('visible');
      orbEl.style.opacity = '';
      orbEl.style.pointerEvents = '';
      bourrelet.classList.remove('visible');
      bourrelet.classList.remove('morphed');
      bourrelетMorphed = false;
      closeMenu();
      demoBtn.textContent = '[ simuler app ouverte ]';
    }
  });

  // Clic bourrelet : morphose → orbe → menu s'ouvre
  bourrelet.addEventListener('click', e => {
    e.stopPropagation();
    if (!bourrelетMorphed) {
      bourrelетMorphed = true;
      bourrelet.classList.add('morphed');
      setTimeout(() => openMenu(), 350);
    } else {
      bourrelетMorphed = false;
      bourrelet.classList.remove('morphed');
      closeMenu();
    }
  });

  // Ferme le menu quand on clique sur l'app window (hors bourrelet)
  appWindow.addEventListener('click', e => {
    if (!bourrelet.contains(e.target)) {
      if (menuOpen) {
        closeMenu();
        bourrelетMorphed = false;
        bourrelet.classList.remove('morphed');
      }
    }
  });

  // Toggles status
  document.getElementById('btn-wifi').addEventListener('click', e => {
    e.stopPropagation();
    const el = document.getElementById('btn-wifi');
    el.classList.toggle('on');
    el.classList.toggle('off');
  });
  document.getElementById('btn-bt').addEventListener('click', e => {
    e.stopPropagation();
    const el = document.getElementById('btn-bt');
    el.classList.toggle('on');
    el.classList.toggle('off');
  });
  document.getElementById('btn-theme').addEventListener('click', e => {
    e.stopPropagation();
  });
</script>
</body>
</html>
